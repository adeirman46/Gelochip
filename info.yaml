# ======================================================
# Project metadata (used for documentation / review)
# ======================================================

project:
  title: "Recursive Intelligence for Analog Chip Generation"
  team: "D05_Gelochip"
  discord: "icdesignboi, adeirman, radhian, bkenneth"
  description: "Gelochip is an agentic-AI platform for generating RF and analog integrated circuits from plain-English specifications to verified and reproducible GF180MCU layouts."
  lvs_config: "lvs_config.json"

pins:
  - name: VCC
    io_type: power
  - name: RFP
    io_type: analog
  - name: RFN
    io_type: analog
  - name: VOUT
    io_type: analog
  - name: VSS
    io_type: ground # note: due to a common ground connection, ground pads are generally not needed.

