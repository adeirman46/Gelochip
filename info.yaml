# Data will be pulled from the main branch of the repository.
# Please ensure that the main branch contains the final data
# intended for submission.
#
# The LVS configuration file is located at:
#
#   ./lvs_config.json
#
# The project.lvs_config property below uses a path relative
# to the repository root.

# ======================================================
# Project metadata
# ======================================================

project:
  title: "Recursive Intelligence for Analog Chip Generation"
  team: "D05_Gelochip"
  discord: "icdesignboi, adeirman, radhian, bkenneth"
  description: "Gelochip is an agentic-AI platform for generating RF and analog integrated circuits from plain-English specifications to verified and reproducible GF180MCU layouts."
  lvs_config: "lvs_config.json"

# ======================================================
# Externally connected I/O pads
# ======================================================

pins:
  - name: VCC
    io_type: power
    
  - name: RFP
    io_type: analog
    secondary_esd: false
    
  - name: RFN
    io_type: analog
    secondary_esd: false
    
  - name: VOUT
    io_type: analog
    secondary_esd: false
    
  - name: VSS
    io_type: ground

