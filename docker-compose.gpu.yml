# ─────────────────────────────────────────────────────────────────────────────
# GPU override — NVIDIA CUDA acceleration for the LLM (much faster generation).
#
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up
#
# Requires the NVIDIA Container Toolkit on the host:
#   https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/latest/install-guide.html
# Verify it works:  docker run --rm --gpus all ubuntu nvidia-smi
#
# Ollama auto-detects the GPU and offloads as many model layers as fit in VRAM
# (the rest stay on CPU), so this helps even on smaller cards.
# ─────────────────────────────────────────────────────────────────────────────
x-gpu: &gpu
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

services:
  ollama: *gpu     # the LLM (biggest speedup)
  studio: *gpu     # PixelatedRF inference + embeddings on GPU
  pixelrf: *gpu
