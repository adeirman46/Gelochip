name: gelochip
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - numpy
  - pandas
  - matplotlib
  - scipy
  - jupyter
  - ipykernel
  - jupyterlab
  # ── EDA system tools (conda-forge provides pre-built binaries) ───────────
  - ngspice          # SPICE simulator — required for PySpice circuit validation
  # ── Frontend toolchain (build the React/Vite SPA in app/frontend/) ───────
  - nodejs>=18       # `cd app/frontend && npm install && npm run build`
  # ── Kaizen RAG agent runtime (NOT pip-installable) ───────────────────────
  # Ollama serves the local agent LLM — install Ollama, then:
  #     ollama pull qwen3.5:9b
  # The Python RAG stack (chromadb, langchain-chroma/-huggingface, pypdf …)
  # comes through requirements.txt below. ChromaDB + the all-MiniLM-L6-v2
  # embedder run fully local — no API keys.
  - pip:
    - -r requirements.txt
